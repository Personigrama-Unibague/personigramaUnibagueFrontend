name: Deploy Frontend Personigrama

on:
  push:
    branches:
      - release
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Install OpenConnect
        run: sudo apt-get install -y openconnect

      - name: Install sshpass
        run: sudo apt-get install -y sshpass

      - name: Connect to VPN
        run: |
          echo "${{ secrets.VPN_PASSWORD }}" | sudo openconnect \
            --protocol=gp \
            --user="${{ secrets.VPN_USER }}" \
            --passwd-on-stdin \
            ${{ secrets.VPN_HOST }} \
            --servercert pin-sha256:e+mVC0ZMBRpVuuepldqN0mN6RvimRBTzlm5zZbGbcmA= -b
        env:
          VPN_PASSWORD: ${{ secrets.VPN_PASSWORD }}
          VPN_USER: ${{ secrets.VPN_USER }}
          VPN_HOST: ${{ secrets.VPN_HOST }}

      - name: Verify VPN connection
        run: ip a

      - name: List network routes
        run: ip route

      - name: Test internal connectivity with SSH
        run: |
          sshpass -p "${{ secrets.INTERNAL_SSH_PASSWORD }}" ssh -o StrictHostKeyChecking=no \
          ${{ secrets.INTERNAL_USER }}@${{ secrets.INTERNAL_RESOURCE_IP }} 'echo "SSH connection successful"'

      - name: Clone repository on remote server
        run: |
          sshpass -p "${{ secrets.INTERNAL_SSH_PASSWORD }}" ssh -o StrictHostKeyChecking=no \
          ${{ secrets.INTERNAL_USER }}@${{ secrets.INTERNAL_RESOURCE_IP }} '
            cd /var/personigrama/personigramaUnibagueFrontend || exit;
            
            git config --global --add safe.directory /var/personigrama/personigramaUnibagueFrontend;

            if [[ $(git status --porcelain) ]]; then
              git stash
              echo "Local changes saved with git stash"
              STASHED=true
            else
              echo "No local changes found"
              STASHED=false
            fi
            
            git pull --rebase;
            
            if [[ "$STASHED" == "true" ]]; then
              git stash drop
              echo "Stash removed"
            fi'      

      - name: Build and Deploy Frontend
        run: |
          sshpass -p "${{ secrets.INTERNAL_SSH_PASSWORD }}" ssh -o StrictHostKeyChecking=no \
          ${{ secrets.INTERNAL_USER }}@${{ secrets.INTERNAL_RESOURCE_IP }} '
            cd /var/personigrama/personigramaUnibagueFrontend;

            # Ensure Node.js and npm are installed
            if ! command -v node &> /dev/null; then
              curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -S bash -
              sudo -S apt-get install -y nodejs
            fi

            # Ensure correct permissions for writing
            sudo chown -R $USER:www-data /var/personigrama/personigramaUnibagueFrontend
            sudo chmod -R 775 /var/personigrama/personigramaUnibagueFrontend

            # Install dependencies
            npm install

            # Build the React project
            npm run build || { echo "Build failed"; exit 1; }

            # Verify build output
            ls -lah /var/personigrama/personigramaUnibagueFrontend/build || echo "Build directory not found!"

            # Move built files to the correct directory
            echo "${{ secrets.INTERNAL_SSH_PASSWORD }}" | sudo -S rm -rf /var/personigrama/personigramaUnibagueFrontend/build
            echo "${{ secrets.INTERNAL_SSH_PASSWORD }}" | sudo -S mv build /var/personigrama/personigramaUnibagueFrontend/build

            # Ensure correct permissions for Apache to serve the files
            sudo chown -R www-data:www-data /var/personigrama/personigramaUnibagueFrontend/build
            sudo chmod -R 755 /var/personigrama/personigramaUnibagueFrontend/build

            # Restart the web server (Apache or Nginx)
            echo "${{ secrets.INTERNAL_SSH_PASSWORD }}" | sudo -S systemctl restart apache2 || sudo systemctl restart nginx

            # Check server status
            echo "${{ secrets.INTERNAL_SSH_PASSWORD }}" | sudo -S systemctl status apache2 --no-pager || sudo systemctl status nginx --no-pager'
