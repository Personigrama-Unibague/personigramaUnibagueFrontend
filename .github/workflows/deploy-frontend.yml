name: Deploy Frontend Personigrama

on:
  push:
    branches:
      - release
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Install OpenConnect
        run: sudo apt-get install -y openconnect

      - name: Install sshpass
        run: sudo apt-get install -y sshpass

      - name: Connect to VPN
        run: |
          echo "${{ secrets.VPN_PASSWORD }}" | sudo openconnect \
            --protocol=gp \
            --user="${{ secrets.VPN_USER }}" \
            --passwd-on-stdin \
            ${{ secrets.VPN_HOST }} \
            --servercert pin-sha256:e+mVC0ZMBRpVuuepldqN0mN6RvimRBTzlm5zZbGbcmA= -b

      - name: Verify VPN connection
        run: ip a

      - name: List network routes
        run: ip route

      - name: Test internal connectivity with SSH
        run: |
          sshpass -p "${{ secrets.INTERNAL_SSH_PASSWORD }}" ssh -o StrictHostKeyChecking=no ${{ secrets.INTERNAL_USER }}@${{ secrets.INTERNAL_RESOURCE_IP }} 'echo "SSH connection successful"'

      - name: Deploy Frontend
        run: |
          sshpass -p "${{ secrets.INTERNAL_SSH_PASSWORD }}" ssh -o StrictHostKeyChecking=no ${{ secrets.INTERNAL_USER }}@${{ secrets.INTERNAL_RESOURCE_IP }} '
            cd /var/personigrama/personigramaUnibagueFrontend;

            # Asegurar que Node.js y npm están instalados
            if ! command -v node &> /dev/null; then
              echo "Node.js no encontrado. Instalando...";
              curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -S bash -;
              sudo -S apt-get install -y nodejs;
            fi

            # Instalar dependencias
            npm install;

            # Construir la aplicación
            npm run build;

            # Verificar que el build se creó correctamente
            if [ ! -d "build" ]; then
              echo "Error: La carpeta build no fue creada!";
              exit 1;
            fi

            # Eliminar el build anterior
            sudo rm -rf /var/personigrama/personigramaUnibagueFrontend/build;

            # Mover el nuevo build a la ubicación correcta
            sudo mv build /var/personigrama/personigramaUnibagueFrontend/;

            # Asignar los permisos correctos
            sudo chown -R www-data:www-data /var/personigrama/personigramaUnibagueFrontend/build;
            sudo chmod -R 755 /var/personigrama/personigramaUnibagueFrontend/build;

            # Reiniciar Apache
            sudo systemctl restart apache2 || sudo systemctl restart nginx;

            # Verificar el estado del servidor
            sudo systemctl status apache2 --no-pager || sudo systemctl status nginx --no-pager;
          '
