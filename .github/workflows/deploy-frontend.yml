name: Deploy Frontend Personigrama

on:
  push:
    branches:
      - release
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Install OpenConnect
        run: sudo apt-get install -y openconnect

      - name: Install sshpass
        run: sudo apt-get install -y sshpass

      - name: Connect to VPN
        run: |
          echo "${{ secrets.VPN_PASSWORD }}" | sudo openconnect \
            --protocol=gp \
            --user="${{ secrets.VPN_USER }}" \
            --passwd-on-stdin \
            ${{ secrets.VPN_HOST }} \
            --servercert pin-sha256:e+mVC0ZMBRpVuuepldqN0mN6RvimRBTzlm5zZbGbcmA= -b

      - name: Deploy Frontend
        run: |
          sshpass -p "${{ secrets.INTERNAL_SSH_PASSWORD }}" ssh -o StrictHostKeyChecking=no \
          ${{ secrets.INTERNAL_USER }}@${{ secrets.INTERNAL_RESOURCE_IP }} '
            # 🔹 1️⃣ Asegurar que la carpeta tiene los permisos correctos
            echo "🔧 Corrigiendo permisos en /var/personigrama..."
            sudo mkdir -p /var/personigrama;
            sudo chown -R $USER:www-data /var/personigrama;
            sudo chmod -R 775 /var/personigrama;

            cd /var/personigrama;

            # 🔹 2️⃣ Marcar el directorio como seguro para Git
            echo "🔧 Configurando Git..."
            git config --global --add safe.directory /var/personigrama;
            git config --global --add safe.directory /var/personigrama/personigramaUnibagueFrontend;

            # 🔹 3️⃣ Eliminar código viejo y clonar nuevamente
            echo "⚠️ Eliminando código anterior..."
            sudo rm -rf personigramaUnibagueFrontend;

            echo "⬇️ Clonando el repositorio..."
            git clone https://github.com/Personigrama-Unibague/personigramaUnibagueFrontend.git;

            cd personigramaUnibagueFrontend;

            git checkout release;
            git pull origin release;

            # 🔹 4️⃣ Eliminar el build anterior (si existe)
            echo "⚠️ Eliminando build anterior..."
            sudo rm -rf build;

            # 🔹 5️⃣ Asegurar que Node.js y npm están instalados
            if ! command -v node &> /dev/null; then
              echo "⚙️ Node.js no encontrado. Instalando...";
              curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -S bash -;
              sudo -S apt-get install -y nodejs;
            fi

            # 🔹 6️⃣ Instalar dependencias con permisos correctos
            echo "📦 Instalando dependencias..."
            sudo -u $USER npm install;

            # 🔹 7️⃣ Construir la aplicación
            echo "🚀 Generando build..."
            sudo -u $USER npm run build;

            # 🔹 8️⃣ Verificar que el build se creó correctamente
            if [ ! -d "build" ]; then
              echo "❌ Error: La carpeta build no fue creada!";
              exit 1;
            fi

            # 🔹 9️⃣ Asegurar permisos correctos
            sudo chown -R www-data:www-data build;
            sudo chmod -R 755 build;

            # 🔹 🔟 Forzar reinicio de Apache y limpiar caché
            echo "♻️ Reiniciando Apache y limpiando caché..."
            sudo systemctl restart apache2 || sudo systemctl restart nginx;
            sudo rm -rf /var/cache/apache2;
            sudo systemctl restart apache2 || sudo systemctl restart nginx;

            # 🔹 ✅ Verificar el estado del servidor
            echo "✅ Verificando estado del servidor..."
            sudo systemctl status apache2 --no-pager || sudo systemctl status nginx --no-pager;
          '
