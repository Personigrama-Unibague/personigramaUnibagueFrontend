name: Deploy Frontend Personigrama

on:
  push:
    branches:
      - release
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Install Dependencies
        run: sudo apt-get update && sudo apt-get install -y openconnect sshpass

      - name: Connect to VPN
        run: |
          echo "${{ secrets.VPN_PASSWORD }}" | sudo openconnect \
            --protocol=gp \
            --user="${{ secrets.VPN_USER }}" \
            --passwd-on-stdin \
            ${{ secrets.VPN_HOST }} \
            --servercert pin-sha256:e+mVC0ZMBRpVuuepldqN0mN6RvimRBTzlm5zZbGbcmA= -b

      - name: Deploy Frontend
        run: |
          sshpass -p "${{ secrets.INTERNAL_SSH_PASSWORD }}" ssh -o StrictHostKeyChecking=no \
          ${{ secrets.INTERNAL_USER }}@${{ secrets.INTERNAL_RESOURCE_IP }} '
          
            echo "🔧 Asegurando permisos correctos en /var/personigrama..."
            sudo mkdir -p /var/personigrama;
            sudo chown -R pasante:pasante /var/personigrama;
            sudo chmod -R 775 /var/personigrama;

            cd /var/personigrama;

            echo "⚠️ Eliminando repositorio anterior..."
            sudo rm -rf personigramaUnibagueFrontend;

            echo "⬇️ Clonando el repositorio..."
            sudo -u pasante git clone https://github.com/Personigrama-Unibague/personigramaUnibagueFrontend.git;

            cd personigramaUnibagueFrontend;

            sudo -u pasante git checkout release;
            sudo -u pasante git pull origin release;

            echo "⚠️ Eliminando build anterior..."
            sudo rm -rf build;

            if ! command -v node &> /dev/null; then
              echo "⚙️ Instalando Node.js..."
              curl -fsSL https://deb.nodesource.com/setup_20.x | sudo bash -;
              sudo apt-get install -y nodejs;
            fi

            echo "📦 Instalando dependencias..."
            sudo -u pasante npm install --legacy-peer-deps;

            echo "🚀 Generando el build..."
            sudo -u pasante npm run build;

            if [ ! -d "build" ]; then
              echo "❌ Error: La carpeta build no fue creada!";
              exit 1;
            fi

            echo "🛠 Estableciendo permisos correctos para build..."
            sudo chown -R pasante:pasante build;
            sudo chmod -R 755 build;

            echo "♻️ Reiniciando Apache y limpiando caché..."
            sudo systemctl restart apache2 || sudo systemctl restart nginx;
            sudo rm -rf /var/cache/apache2;
            sudo systemctl restart apache2 || sudo systemctl restart nginx;

            echo "✅ Verificando estado del servidor..."
            sudo systemctl status apache2 --no-pager || sudo systemctl status nginx --no-pager;
          '
