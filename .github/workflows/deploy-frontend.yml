name: Deploy Frontend Personigrama

on:
  push:
    branches:
      - release
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Install Dependencies
        run: sudo apt-get update && sudo apt-get install -y openconnect sshpass

      - name: Connect to VPN
        run: |
          echo "${{ secrets.VPN_PASSWORD }}" | sudo openconnect \
            --protocol=gp \
            --user="${{ secrets.VPN_USER }}" \
            --passwd-on-stdin \
            ${{ secrets.VPN_HOST }} \
            --servercert pin-sha256:e+mVC0ZMBRpVuuepldqN0mN6RvimRBTzlm5zZbGbcmA= -b

      - name: Deploy Frontend
        run: |
          sshpass -p "${{ secrets.INTERNAL_SSH_PASSWORD }}" ssh -o StrictHostKeyChecking=no \
          ${{ secrets.INTERNAL_USER }}@${{ secrets.INTERNAL_RESOURCE_IP }} '
          
            echo " Setting correct permissions on /var/personigrama..."
            sudo mkdir -p /var/personigrama;
            sudo chown -R pasante:www-data /var/personigrama;
            sudo chmod -R 775 /var/personigrama;

            cd /var/personigrama;

            echo "⚠️ Removing old repository..."
            sudo rm -rf personigramaUnibagueFrontend;

            echo "⬇️ Cloning the repository..."
            git clone https://github.com/Personigrama-Unibague/personigramaUnibagueFrontend.git;

            cd personigramaUnibagueFrontend;

            git checkout release;
            git pull origin release;

            echo "⚠️ Removing previous build..."
            sudo rm -rf build;

            if ! command -v node &> /dev/null; then
              echo "⚙️ Installing Node.js..."
              curl -fsSL https://deb.nodesource.com/setup_20.x | sudo bash -;
              sudo apt-get install -y nodejs;
            fi

            echo " Installing dependencies..."
            sudo -u pasante npm install --legacy-peer-deps;

            echo "♻️ Cleaning and forcing a new build..."
            sudo -u pasante npm run clean;
            sudo -u pasante npm run build;

            if [ ! -d "build" ]; then
              echo " Error: Build folder was not created!";
              exit 1;
            fi

            echo " Ensuring `index.html` and assets are correctly copied..."
            sudo cp public/index.html build/index.html
            sudo cp public/manifest.json build/manifest.json
            sudo cp public/favicon_logo.png build/favicon_logo.png

            echo "Setting correct permissions for build..."
            sudo chown -R www-data:www-data build;
            sudo chmod -R 755 build;

            echo "♻️ Restarting Apache and clearing cache..."
            sudo systemctl restart apache2 || sudo systemctl restart nginx;
            sudo rm -rf /var/cache/apache2;
            sudo systemctl restart apache2 || sudo systemctl restart nginx;

            echo " Checking server status..."
            sudo systemctl status apache2 --no-pager || sudo systemctl status nginx --no-pager;
          '
